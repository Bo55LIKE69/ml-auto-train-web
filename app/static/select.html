<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>表格ML自动训练工具 - 选择目标标签</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<header class="navbar">
  <div class="nav-inner">
    <span class="logo"><span class="logo-mark"></span>表格ML自动训练工具</span>
    <nav class="stepper">
      <a class="step" href="/"><span class="step-num">01</span><span class="step-label">上传数据</span></a>
      <span class="step-line"></span>
      <a class="step active" href="/select.html"><span class="step-num">02</span><span class="step-label">选择标签</span></a>
      <span class="step-line"></span>
      <a class="step" href="/result.html"><span class="step-num">03</span><span class="step-label">实验结果</span></a>
    </nav>
  </div>
</header>

<main class="container narrow">
  <section class="card">
    <p class="eyebrow">CONFIG / STEP 02</p>
    <h1>配置训练任务</h1>
    <p class="subtitle">选择要预测的目标标签列，系统将自动完成预处理与多模型训练对比。</p>

    <form id="configForm">
      <div class="field">
        <label for="targetSelect">目标标签列 <span class="req">*</span></label>
        <select id="targetSelect" required>
          <option value="">-- 加载中 --</option>
        </select>
        <p class="hint">系统已按"取值适中/语义关键词"给出推荐，请确认或改选</p>
      </div>

      <div class="field">
        <label for="taskType">任务类型</label>
        <select id="taskType">
          <option value="auto">自动判断（推荐）</option>
          <option value="classification">分类</option>
          <option value="regression">回归</option>
        </select>
        <p class="hint">自动判断规则：数值型目标且取值数&gt;20 -> 回归，否则分类</p>
      </div>

      <div class="field">
        <label>剔除无意义列（ID/编号等，可多选）</label>
        <div id="idColsBox" class="checkbox-group">
          <p class="hint">加载中…</p>
        </div>
      </div>

      <div id="warnBox" class="warn" hidden></div>

      <div class="field">
        <label>训练模式</label>
        <div class="mode-switch">
          <label class="mode-option">
            <input type="radio" name="mode" value="auto" checked>
            <span class="mode-card">
              <strong>自动选模型</strong>
              <small>系统自动跑全部模型（12 个分类 / 10 个回归）并选最优</small>
            </span>
          </label>
          <label class="mode-option">
            <input type="radio" name="mode" value="manual">
            <span class="mode-card">
              <strong>手动选模型</strong>
              <small>自己勾选要对比的模型，只跑选中的</small>
            </span>
          </label>
        </div>
      </div>

      <div class="field" id="modelPickField" hidden>
        <label>选择模型 <span class="req">*</span>（至少选 1 个）</label>
        <div id="modelPickBox" class="checkbox-group">
          <p class="hint">加载中…</p>
        </div>
        <p class="hint">勾选的模型将参与训练对比，未勾选的不跑</p>
      </div>

      <button type="submit" class="btn-primary btn-block" id="trainBtn">开始训练</button>
      <div id="trainStatus" class="status" hidden></div>
    </form>
  </section>
</main>

<footer class="footer">
  <span>基于 FastAPI + scikit-learn 的自动机器学习训练工具</span>
  <span class="mono">v1.0.0</span>
</footer>

<script src="/js/select.js"></script>
</body>
</html>
