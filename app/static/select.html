<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>表格ML自动训练工具 - 选择目标标签</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<header class="navbar">
  <div class="nav-inner">
    <span class="logo">表格ML自动训练工具</span>
    <nav>
      <a href="/">上传数据</a>
      <a href="/select.html" class="active">选择标签</a>
      <a href="/result.html">实验结果</a>
    </nav>
  </div>
</header>

<main class="container narrow">
  <section class="card">
    <h1>配置训练任务</h1>
    <p class="subtitle">选择要预测的目标标签列，系统将自动完成预处理与多模型训练对比。</p>

    <form id="configForm">
      <div class="field">
        <label for="targetSelect">目标标签列 <span class="req">*</span></label>
        <select id="targetSelect" required>
          <option value="">-- 加载中 --</option>
        </select>
        <p class="hint">系统已按"取值适中/语义关键词"给出推荐，请确认或改选</p>
      </div>

      <div class="field">
        <label for="taskType">任务类型</label>
        <select id="taskType">
          <option value="auto">自动判断（推荐）</option>
          <option value="classification">分类</option>
          <option value="regression">回归</option>
        </select>
        <p class="hint">自动判断规则：数值型目标且取值数&gt;20 -> 回归，否则分类</p>
      </div>

      <div class="field">
        <label>剔除无意义列（ID/编号等，可多选）</label>
        <div id="idColsBox" class="checkbox-group">
          <p class="hint">加载中…</p>
        </div>
      </div>

      <div id="warnBox" class="warn" hidden></div>

      <button type="submit" class="btn-primary btn-block" id="trainBtn">开始自动训练</button>
      <div id="trainStatus" class="status" hidden></div>
    </form>
  </section>
</main>

<script src="/js/select.js"></script>
</body>
</html>
