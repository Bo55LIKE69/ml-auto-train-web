<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>表格ML自动训练工具 - 实验结果</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<header class="navbar">
  <div class="nav-inner">
    <span class="logo">📊 表格ML自动训练工具</span>
    <nav>
      <a href="/">上传数据</a>
      <a href="/select.html">选择标签</a>
      <a href="/result.html" class="active">实验结果</a>
    </nav>
  </div>
</header>

<main class="container">
  <section class="card" id="emptyCard">
    <h1>实验结果</h1>
    <p class="subtitle">还没有训练结果。</p>
    <p class="subtitle">请先 <a href="/">上传数据集</a>，或直接输入 task_id 查看历史结果：</p>
    <form id="loadForm" class="inline-form">
      <input type="text" id="taskIdInput" placeholder="输入 task_id（如 a1b2c3d4e5f6）">
      <button type="submit" class="btn-primary">加载结果</button>
    </form>
    <p class="hint">最近一次训练结果：<a href="#" id="lastTaskLink">自动加载</a></p>
  </section>

  <section class="card" id="resultCard" hidden>
    <div class="result-head">
      <h1>实验结果</h1>
      <span class="badge" id="taskTypeBadge"></span>
      <span class="badge badge-gray" id="taskIdBadge"></span>
    </div>

    <div id="warnBox" class="warn" hidden></div>

    <h2>📋 数据集信息</h2>
    <div id="dataStats" class="stats-grid"></div>

    <h2>📊 模型对比</h2>
    <div class="table-wrap">
      <table id="modelTable">
        <thead><tr id="modelHead"></tr></thead>
        <tbody id="modelBody"></tbody>
      </table>
    </div>
    <div id="bestBox" class="best"></div>

    <h2>🖼️ 可视化</h2>
    <div id="plotArea" class="plot-grid"></div>

    <section id="aiBox" class="card" hidden>
      <h2>🤖 AI 解读与建议 <span class="badge badge-ai">可选增强</span></h2>
      <div class="ai-content"></div>
    </section>

    <h2>🌟 特征重要性 Top15</h2>
    <div class="table-wrap">
      <table id="impTable">
        <thead><tr><th>排名</th><th>特征</th><th>重要性</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>

    <h2>📥 下载</h2>
    <div class="btn-row">
      <a class="btn-secondary" id="dlReport">⬇ 下载实验报告 (Markdown)</a>
      <a class="btn-secondary" id="dlScript">⬇ 下载复现脚本 (Python)</a>
      <a class="btn-secondary" id="dlJson">⬇ 下载结果 JSON</a>
    </div>
    <div class="btn-row">
      <a href="/select.html" class="btn-ghost">← 重新配置任务</a>
    </div>
  </section>
</main>

<script src="/js/result.js"></script>
</body>
</html>
